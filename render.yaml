# Render Blueprint at repo root — points to api/
services:
  - type: web
    name: license-loader-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # External database (Neon). Set the actual connection string manually in
      # the Render dashboard: API service -> Environment -> DATABASE_URL.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
